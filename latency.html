<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节点延迟测试 - PerkRadar</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 720px; margin: 0 auto; padding: 24px 16px; color: #222; }
  h1 { font-size: 22px; }
  p.note { color: #666; font-size: 14px; line-height: 1.7; }
  button { padding: 10px 22px; font-size: 16px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; font-size: 14px; }
  th { background: #f5f5f5; }
  .ok { color: #1a7f37; } .bad { color: #cf222e; } .na { color: #888; }
</style>
</head>
<body>
<h1>节点延迟测试</h1>
<p class="note">纯前端测试，不走后端、不走代理流量。方法：用 Performance API + <code>fetch(mode: 'no-cors')</code> 向目标发一个轻量请求并计时。
<strong>结果只是近似值</strong>：它测的是“浏览器到目标 HTTPS 端口的往返耗时”（含 DNS 解析与 TLS 握手），不是代理协议的真实延迟；
浏览器出于安全原因无法直接测非 HTTP 端口的 TCP 延迟，因此住宅节点的中转端口无法在此页测量，仅列出说明。</p>
<p><button id="run">开始测试</button> <span id="status"></span></p>
<table>
  <thead><tr><th>目标</th><th>地址</th><th>耗时（近似值）</th><th>状态</th></tr></thead>
  <tbody id="results"></tbody>
</table>
<p class="note">提示：数值受当前网络波动影响较大，多测几次取中位数更准；若某项超时（10 秒）则显示“超时/不可达”。</p>
<script>
const TARGETS = [
  { name: "订阅地址", url: "https://warm-voyager-3745.de.deplexo.com/clash.yaml" },
  { name: "松-Zoho-01（美国）", url: "https://my-xhttp-node-10138371226.development.catalystappsail.com/" },
  { name: "松-Zoho-JP-01（日本）", url: "https://my-xhttp-node-jp-100002612899.development.catalystappsail.jp/" },
  { name: "松-住宅-美国（中转端口，非 HTTP）", url: null, note: "浏览器无法直接测 TCP 端口，仅作记录" }
];

async function probe(url) {
  const t0 = performance.now();
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    await fetch(url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
    clearTimeout(timer);
    return { ms: Math.round(performance.now() - t0), ok: true };
  } catch (e) {
    return { ms: Math.round(performance.now() - t0), ok: false };
  }
}

document.getElementById("run").addEventListener("click", async () => {
  const tbody = document.getElementById("results");
  const status = document.getElementById("status");
  tbody.innerHTML = "";
  status.textContent = "测试中…";
  for (const t of TARGETS) {
    const tr = document.createElement("tr");
    if (!t.url) {
      tr.innerHTML = `<td>${t.name}</td><td class="na">resi-bridge-us.rainproxy.io:1111</td><td class="na">—</td><td class="na">${t.note}</td>`;
    } else {
      const r = await probe(t.url);
      tr.innerHTML = `<td>${t.name}</td><td>${t.url}</td>` +
        (r.ok
          ? `<td class="ok">约 ${r.ms} ms</td><td class="ok">可达</td>`
          : `<td class="bad">约 ${r.ms} ms 后失败</td><td class="bad">超时/不可达</td>`);
    }
    tbody.appendChild(tr);
  }
  status.textContent = "完成（以上均为近似值）";
});
</script>
</body>
</html>
